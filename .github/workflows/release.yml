name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Check release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apk/app/build.gradle.kts)
          test "$TAG" = "v$version"
      - name: Build and test both applications
        run: |
          (cd apk && bash gradlew testDebugUnitTest assembleRelease -PupdateRepository="$GITHUB_REPOSITORY" --no-daemon)
          (cd remote && bash gradlew testDebugUnitTest assembleRelease --no-daemon)
      - name: Sign APKs
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          mkdir -p release-output
          keyfile="$RUNNER_TEMP/gigatv-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          sdkmanager 'build-tools;34.0.0' > /dev/null
          for project in apk remote; do
            name=GigaTV
            test "$project" != remote || name=GigaTV-Remote
            "$tools/zipalign" -p -f 4 "$project/app/build/outputs/apk/release/app-release-unsigned.apk" "release-output/$name.apk"
            "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD "release-output/$name.apk"
            "$tools/apksigner" verify "release-output/$name.apk"
          done
      - name: Generate update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/create-update-manifest.py \
            --apk release-output/GigaTV.apk \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --output release-output/update.json
      - name: Publish APKs and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-output/GigaTV.apk release-output/GigaTV-Remote.apk release-output/update.json --verify-tag --generate-notes --latest
